# Builds and deploys to Cloudflare Pages on every push to main.
# The Pages project is a direct-upload project, so it cannot use Cloudflare's Git integration.
# Requires the secret CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and the variable CLOUDFLARE_ACCOUNT_ID.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Creates the Pages project on the first run. --force keeps Wrangler from switching to Workers instead.
      - name: Ensure the Pages project exists
        run: |
          if ! npx wrangler pages project list | grep -q 'montblank-portfolio '; then
            npx wrangler pages project create montblank-portfolio --production-branch main --force
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # `deploy` runs the build first, and the build regenerates the font subsets.
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
